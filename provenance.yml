apiVersion: provenance.dev/v2
project:
  id: first-developer-pilot
  name: ProvenanceFirstDeveloperPilot
artifact:
  id: first-developer-pilot
  version: 0.1.0
  path: build/first-developer-pilot.jar
paper:
  recommendations:
    enabled: true
    apiFloor: 1.20.6
    newVersions: informational
  matrix:
    - id: paper-1.20.6
      minecraftVersion: 1.20.6
      paperBuild: 151
      javaVersion: 21
      policy: required
    - id: paper-1.21.4
      minecraftVersion: 1.21.4
      paperBuild: 232
      javaVersion: 21
      policy: informational
  gatePolicy:
    requiredFailure: block
    informationalFailure: report
    infrastructureFailure: retry
    maxInfrastructureRetries: 2
dependencies: []
tests:
  startup:
    timeoutSeconds: 120
    stabilizationSeconds: 10
    requirePluginEnabled: true
    shutdownTimeoutSeconds: 30
    requireCleanShutdown: true
  console: []
release:
  mode: test-only
  targets: []
network:
  mode: none
  permissions: []
  maximumConnections: 0
  maximumBytesPerSecond: 0
resources:
  cpuCores: 1
  memoryMiB: 2048
  diskMiB: 4096
  processes: 256
  wallTimeoutSeconds: 900
  logBytes: 10485760
